; EX30 GPS speedometer - M5Stack StopWatch (C152) + GPS/BDS Unit v1.1 (AT6668)
; Board settings follow M5Stack's PlatformIO guide for the StopWatch.

[platformio]
; Local, git-ignored overrides (OTA password, OTA address). Copy secrets_example.ini
; to secrets.ini and edit it. The build works without it, using the defaults below.
extra_configs = secrets.ini

[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; Library versions pinned to the commits this was built and tested against.
; To update, change the hash after the # (or remove it for the latest).
lib_deps =
    https://github.com/m5stack/M5Unified#44952cb8e4ac88bf04ad23b9dfd6f4b05c788348
    m5stack/M5GFX @ ^0.2.36
    https://github.com/m5stack/M5PM1#315d2899c863ae34b59197392b9f4c59490751ef
    https://github.com/m5stack/M5IOE1#8401119bf171cb8f906fbe22e7490989077bbee8
    mikalhart/TinyGPSPlus @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.2.0

; Over-the-air upload: same build, sent over Wi-Fi. The StopWatch must be on the
; same network as the PC (e.g. both on home Wi-Fi, Network 2).
; Choose this environment in the PlatformIO toolbar, then Upload.
; The password and address come from [ota] above or from secrets.ini.
; Use the IP address as host if .local does not resolve on your PC.
[env:ota]
extends = env:m5stack-stopwatch
upload_protocol = espota
upload_port = ${ota.host}
upload_flags =
    --auth=${ota.password}
    --port=3232

; Defaults, overridden by secrets.ini. password must match the device's OTA password.
password = speedo1234
host = ex30-speedo.local
